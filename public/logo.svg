<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="128" fill="#ffffff"/>
  <g transform="translate(256 256)">
    <!-- 4 Interlocking Swoops forming a diamond swirl -->
    <path fill="#0f172a" d="
      M -150 -30 
      C -150 -100 -100 -150 -30 -150
      C 40 -150 90 -100 105 -50
      C 60 -75 10 -80 -30 -60
      C -70 -40 -100 -10 -110 35
      C -125 15 -140 -5 -150 -30 Z
    "/>
    <path fill="#0f172a" transform="rotate(90)" d="
      M -150 -30 
      C -150 -100 -100 -150 -30 -150
      C 40 -150 90 -100 105 -50
      C 60 -75 10 -80 -30 -60
      C -70 -40 -100 -10 -110 35
      C -125 15 -140 -5 -150 -30 Z
    "/>
    <path fill="#0f172a" transform="rotate(180)" d="
      M -150 -30 
      C -150 -100 -100 -150 -30 -150
      C 40 -150 90 -100 105 -50
      C 60 -75 10 -80 -30 -60
      C -70 -40 -100 -10 -110 35
      C -125 15 -140 -5 -150 -30 Z
    "/>
    <path fill="#0f172a" transform="rotate(270)" d="
      M -150 -30 
      C -150 -100 -100 -150 -30 -150
      C 40 -150 90 -100 105 -50
      C 60 -75 10 -80 -30 -60
      C -70 -40 -100 -10 -110 35
      C -125 15 -140 -5 -150 -30 Z
    "/>
